[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"
[project]
name = "data-qd-166"
version = "0.1.0"
description = "多层物料需求净算"
requires-python = ">=3.11"
